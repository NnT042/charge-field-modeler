[package]
name = "charge_field_modeler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = "0.5"
glam = "0.32"
rayon = "1"
wgpu = { version = "30.0.1", features = ["glsl", "vulkan"], optional = true }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
rand = { version = "0.10.3", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[features]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:rand"]

# Tests and reports: release-speed code without the whole-program LTO and
# single codegen unit that make `--release` test builds take ~20 min with
# wgpu. Same IEEE float results (Rust never fast-maths).
#   cargo test --profile fast --manifest-path rust/Cargo.toml ...
# The Godot .dll still builds with --release.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
